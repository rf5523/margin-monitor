name: update-margin-data

# 每天 22:00 台北時間抓證交所資料,更新 docs/data.json
# GitHub Actions 的排程一律用 UTC:22:00 台北 = 14:00 UTC
# 注意:GitHub 排程可能延遲幾分鐘到十幾分鐘,是正常的。
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:  # 也可以在 Actions 分頁手動按 Run workflow 立即跑一次

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取證交所資料
        run: python fetch_margin.py
      - name: 有新資料才 commit
        run: |
          git config user.name "margin-bot"
          git config user.email "margin-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "更新融資水位資料 $(date -u +%Y-%m-%d)"
          git push
